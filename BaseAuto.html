<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="База пропусков" />
  <title>База пропусков — Поиск ТС</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    /* Плавная горизонтальная прокрутка чипов без полос прокрутки */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Визуальный стиль российского номерного знака */
    .ru-plate {
      display: inline-flex;
      align-items: stretch;
      background: #ffffff;
      border: 2px solid #1e293b;
      border-radius: 7px;
      color: #0f172a;
      font-family: 'JetBrains Mono', monospace;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      line-height: 1;
    }
    .ru-plate-main {
      padding: 6px 10px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }
    .ru-plate-reg {
      border-left: 1.5px solid #1e293b;
      padding: 3px 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      min-width: 42px;
    }
    .ru-plate-reg-num {
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.05;
    }
    .ru-plate-rus {
      font-size: 0.52rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #334155;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .ru-flag {
      display: inline-block;
      width: 10px;
      height: 6px;
      background: linear-gradient(to bottom, #ffffff 0% 33%, #0039a6 33% 66%, #d52b1e 66% 100%);
      border: 0.5px solid #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

  <!-- Верхняя панель (Шапка) -->
  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <!-- Заголовок и счётчик -->
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center shrink-0 shadow-inner">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 17h8M7 11l1.5-4.5A2 2 0 0110.4 5h3.2a2 2 0 011.9 1.5L17 11m-10 0h10m-10 0a2 2 0 00-2 2v3a1 1 0 001 1h1a1 1 0 001-1v-1h8v1a1 1 0 001 1h1a1 1 0 001-1v-3a2 2 0 00-2-2" />
            </svg>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h1 class="text-base sm:text-lg font-bold tracking-tight truncate">База пропусков — Поиск ТС</h1>
              <span id="totalBadge" class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold bg-blue-500/20 text-blue-200 border border-blue-400/30 shrink-0">382</span>
            </div>
            <p class="text-[11px] sm:text-xs text-slate-400 truncate" id="offlineStatusText">Готово к работе • Офлайн-база</p>
          </div>
        </div>

        <!-- Кнопки действий -->
        <div class="flex items-center gap-1.5 sm:gap-2">
          <button id="installPwaBtn" type="button" class="hidden items-center gap-1.5 px-3 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-xs font-semibold transition cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V3"/></svg>
            <span class="hidden sm:inline">На экран</span>
          </button>

          <button id="openAddModalBtn" type="button" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-xs sm:text-sm font-semibold text-white shadow-sm transition cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            <span>Добавить авто</span>
          </button>

          <div class="relative">
            <button id="exportMenuBtn" type="button" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 active:scale-95 text-xs sm:text-sm font-medium text-slate-200 transition cursor-pointer" title="Экспорт и резервная копия">
              <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              <span class="hidden md:inline">Экспорт</span>
            </button>
            <!-- Выпадающее меню экспорта -->
            <div id="exportDropdown" class="hidden absolute right-0 mt-2 w-56 rounded-2xl bg-white text-slate-800 shadow-xl border border-slate-200 py-1.5 z-40">
              <button type="button" id="exportCsvBtn" class="w-full text-left px-4 py-2.5 text-sm hover:bg-slate-100 flex items-center gap-2.5 font-medium cursor-pointer">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                Скачать CSV (для Excel)
              </button>
              <button type="button" id="exportJsonBtn" class="w-full text-left px-4 py-2.5 text-sm hover:bg-slate-100 flex items-center gap-2.5 font-medium cursor-pointer">
                <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                Скачать JSON (резервная копия)
              </button>
              <div class="border-t border-slate-100 my-1"></div>
              <button type="button" id="resetCustomBtn" class="w-full text-left px-4 py-2 text-xs text-rose-600 hover:bg-rose-50 flex items-center gap-2 cursor-pointer">
                Сбросить добавленные авто
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Панель поиска и фильтров -->
  <section class="bg-white border-b border-slate-200 shadow-sm sticky top-[60px] sm:top-[64px] z-20">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-3 space-y-2.5">
      <!-- Строка поиска -->
      <div class="flex flex-col sm:flex-row gap-2">
        <div class="relative flex-1">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1010.5 18a7.5 7.5 0 006.15-3.35z" />
            </svg>
          </div>
          <input
            id="searchInput"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            autofocus
            placeholder="Введите цифры номера (напр. 770, 400, 1) или фамилию, авто..."
            class="w-full pl-11 pr-24 py-3 text-base sm:text-lg font-medium bg-slate-50 border-2 border-slate-300 focus:border-blue-600 focus:bg-white rounded-2xl outline-none transition placeholder:text-slate-400 placeholder:text-sm sm:placeholder:text-base"
          />
          <div class="absolute inset-y-0 right-0 pr-2 flex items-center gap-1">
            <button
              id="toggleNumpadBtn"
              type="button"
              title="Цифровая клавиатура"
              class="p-2 rounded-xl text-slate-500 hover:text-blue-600 hover:bg-blue-50 active:scale-95 transition cursor-pointer"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h2v2H4V6zm7 0h2v2h-2V6zm7 0h2v2h-2V6zM4 11h2v2H4v-2zm7 0h2v2h-2v-2zm7 0h2v2h-2v-2zM4 16h2v2H4v-2zm7 0h2v2h-2v-2zm7 0h2v2h-2v-2z" />
              </svg>
            </button>
            <button
              id="clearSearchBtn"
              type="button"
              aria-label="Очистить поиск"
              class="hidden p-2 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-sm leading-none active:scale-95 transition cursor-pointer"
            >
              ✕
            </button>
          </div>
        </div>

        <!-- Переключатель режима поиска -->
        <div class="flex rounded-2xl bg-slate-100 p-1 border border-slate-200 shrink-0 self-stretch sm:self-auto">
          <button
            id="modeAllBtn"
            type="button"
            class="flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-white text-blue-700 shadow-sm transition cursor-pointer"
          >
            Все поля
          </button>
          <button
            id="modeDigitsBtn"
            type="button"
            class="flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-900 transition cursor-pointer"
          >
            Только цифры номера
          </button>
        </div>
      </div>

      <!-- Встроенная цифровая панель быстрого ввода -->
      <div id="numpadPanel" class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-2">
        <div class="grid grid-cols-6 sm:grid-cols-12 gap-1.5">
          <button type="button" data-digit="1" class="numpad-key py-2.5 rounded-xl bg-white border border-slate-300 font-mono font-bold text-base hover:bg-blue-50 active:bg-blue-600 active:text-white shadow-xs transition cursor-pointer">1</button>
          <button type="button" data-digit="2" class="numpad-key py-2.5 rounded-xl bg-white border border-slate-300 font-mono font-bold text-base hover:bg-blue-50 active:bg-blue-600 active:text-white shadow-xs transition cursor-pointer">2</button>
          <button type="button" data-digit="3" class="numpad-key py-2.5 rounded-xl bg-white border border-slate-300 font-mono font-bold text-base hover:bg-blue-50 active:bg-blue-600 active:text-white shadow-xs transition cursor-pointer">3</button>
          <button type="button" data-digit="4" class="numpad-key py-2.5 rounded-xl bg-white border border-slate-300 font-mono font-bold text-base hover:bg-blue-50 active:bg-blue-600 active:text-white shadow-xs transition cursor-pointer">4</button>
          <button type="button" data-digit="5" class="numpad-key py-2.5 rounded-xl bg-white border border-slate-300 font-mono font-bold text-base hover:bg-blue-50 active:bg-blue-600 active:text-white shadow-xs transition cursor-pointer">5</button>
          <button type="button" data-digit="6" class="numpad-key py-2.5 rounded-xl bg-white border border-slate-300 font-mono font-bold text-base hover:bg-blue-50 active:bg-blue-600 active:text-white shadow-xs transition cursor-pointer">6</button>
          <button type="button" data-digit="7" class="numpad-key py-2.5 rounded-xl bg-white border border-slate-300 font-mono font-bold text-base hover:bg-blue-50 active:bg-blue-600 active:text-white shadow-xs transition cursor-pointer">7</button>
          <button type="button" data-digit="8" class="numpad-key py-2.5 rounded-xl bg-white border border-slate-300 font-mono font-bold text-base hover:bg-blue-50 active:bg-blue-600 active:text-white shadow-xs transition cursor-pointer">8</button>
          <button type="button" data-digit="9" class="numpad-key py-2.5 rounded-xl bg-white border border-slate-300 font-mono font-bold text-base hover:bg-blue-50 active:bg-blue-600 active:text-white shadow-xs transition cursor-pointer">9</button>
          <button type="button" data-digit="0" class="numpad-key py-2.5 rounded-xl bg-white border border-slate-300 font-mono font-bold text-base hover:bg-blue-50 active:bg-blue-600 active:text-white shadow-xs transition cursor-pointer">0</button>
          <button type="button" id="numpadBackspace" class="py-2.5 rounded-xl bg-amber-50 border border-amber-300 text-amber-800 font-bold text-sm hover:bg-amber-100 active:scale-95 transition cursor-pointer">⌫</button>
          <button type="button" id="numpadClear" class="py-2.5 rounded-xl bg-rose-50 border border-rose-300 text-rose-700 font-bold text-xs hover:bg-rose-100 active:scale-95 transition cursor-pointer">Сброс</button>
        </div>
      </div>

      <!-- Фильтры-чипы: Списки -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5" id="listChipsContainer"></div>

      <!-- Фильтры-чипы: Статус досмотра + Счётчик найденного -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-0.5">
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar" id="statusChipsContainer">
          <button type="button" data-status="all" class="status-chip px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-white transition cursor-pointer shrink-0">
            Все статусы
          </button>
          <button type="button" data-status="no_inspection" class="status-chip px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200 hover:bg-emerald-100 transition cursor-pointer shrink-0">
            ✓ Без досмотра
          </button>
          <button type="button" data-status="with_inspection" class="status-chip px-3 py-1.5 rounded-xl text-xs font-semibold bg-rose-50 text-rose-800 border border-rose-200 hover:bg-rose-100 transition cursor-pointer shrink-0">
            ! С досмотром
          </button>
        </div>

        <div class="text-xs sm:text-sm font-medium text-slate-600">
          Найдено: <span id="foundCount" class="font-bold text-slate-900">382</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Основная рабочая область с карточками -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-4">
    <!-- Пустой результат -->
    <div id="emptyState" class="hidden bg-white rounded-3xl border border-slate-200 p-8 sm:p-12 text-center shadow-xs my-4">
      <div class="w-14 h-14 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1010.5 18a7.5 7.5 0 006.15-3.35z" />
        </svg>
      </div>
      <h2 class="text-lg font-bold text-slate-800">Автомобили не найдены</h2>
      <p class="text-sm text-slate-500 mt-1 max-w-md mx-auto">Попробуйте изменить запрос, переключить режим поиска или сбросить выбранные фильтры.</p>
      <button id="resetFiltersBtn" type="button" class="mt-4 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold transition cursor-pointer">
        Сбросить поиск и фильтры
      </button>
    </div>

    <!-- Сетка карточек -->
    <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4"></div>

    <!-- Кнопка подгрузки остальных карточек при большом списке -->
    <div id="loadMoreWrap" class="hidden mt-6 text-center">
      <button id="loadMoreBtn" type="button" class="px-6 py-3 rounded-2xl bg-white hover:bg-slate-50 border border-slate-300 text-sm font-semibold text-slate-700 shadow-xs active:scale-95 transition cursor-pointer">
        Показать ещё записи
      </button>
    </div>
  </main>

  <!-- Модальное окно добавления автомобиля -->
  <div id="addModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl border border-slate-200 overflow-hidden max-h-[92vh] flex flex-col">
      <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
        <h2 class="text-base sm:text-lg font-bold">Добавить автомобиль в базу</h2>
        <button id="closeAddModalBtn" type="button" class="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 cursor-pointer">✕</button>
      </div>
      <form id="addCarForm" class="p-5 space-y-3.5 overflow-y-auto">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Название списка *</label>
          <select id="fList" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-600 outline-none text-sm font-semibold">
            <option value="21 пост (основной)">21 пост (основной)</option>
            <option value="Мир Интеллекта">Мир Интеллекта</option>
            <option value="Хедер Менахем">Хедер Менахем</option>
            <option value="Музей (постоянные пропуска)">Музей (постоянные пропуска)</option>
            <option value="Авто Бороды">Авто Бороды</option>
          </select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Гос. номер *</label>
            <input id="fPlate" type="text" required placeholder="Напр. А 777 АА 797" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-600 outline-none text-sm font-mono font-bold uppercase" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Марка / модель</label>
            <input id="fModel" type="text" placeholder="Напр. Мерседес" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-600 outline-none text-sm" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Цвет</label>
            <input id="fColor" type="text" placeholder="Напр. черный" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-600 outline-none text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Статус досмотра</label>
            <select id="fStatusPreset" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-600 outline-none text-sm">
              <option value="">Обычный / не указан</option>
              <option value="Без досмотра">Без досмотра</option>
              <option value="С досмотром">С досмотром</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Водитель</label>
            <input id="fDriver" type="text" placeholder="ФИО водителя" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-600 outline-none text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Организация</label>
            <input id="fOrg" type="text" placeholder="Организация / объект" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-600 outline-none text-sm" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Телефон</label>
            <input id="fPhone" type="tel" placeholder="8-900-000-00-00" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-600 outline-none text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Примечание</label>
            <input id="fNote" type="text" placeholder="Доп. информация" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-600 outline-none text-sm" />
          </div>
        </div>

        <div class="pt-2 flex items-center justify-end gap-2">
          <button type="button" id="cancelAddModalBtn" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold cursor-pointer">Отмена</button>
          <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold shadow-sm cursor-pointer">Сохранить в базу</button>

    // =========================================================================
    // 2. СОСТОЯНИЕ ПРИЛОЖЕНИЯ И LOCALSTORAGE
    // =========================================================================
    const STORAGE_KEY = 'baza_propuskov_custom_cars_v1';

    let customCars = [];
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) customCars = parsed;
      }
    } catch (e) {
      console.warn('Не удалось прочитать localStorage:', e);
    }

    let allCars = [];
    let filteredCars = [];
    let activeList = 'ALL';
    let activeStatus = 'all';
    let digitsOnlyMode = false;
    let visibleLimit = 60;

    const LIST_ORDER = [
      '21 пост (основной)',
      'Мир Интеллекта',
      'Хедер Менахем',
      'Музей (постоянные пропуска)',
      'Авто Бороды'
    ];

    const LIST_STYLES = {
      '21 пост (основной)': 'bg-blue-100 text-blue-900 border-blue-200',
      'Мир Интеллекта': 'bg-violet-100 text-violet-900 border-violet-200',
      'Хедер Менахем': 'bg-amber-100 text-amber-900 border-amber-200',
      'Музей (постоянные пропуска)': 'bg-teal-100 text-teal-900 border-teal-200',
      'Авто Бороды': 'bg-slate-800 text-white border-slate-700'
    };

    // Извлечение основного цифрового номера из строки гос. номера
    function extractMainNumber(plate) {
      const cleaned = String(plate || '').trim();
      // Ищем первую группу из 1-4 цифр (основной номер, до региона)
      const match = cleaned.match(/\d{1,4}/);
      return match ? parseInt(match[0], 10) : 0;
    }

    // Определение статуса досмотра по примечанию
    function getInspectionStatus(note) {
      const n = String(note || '').toLowerCase();
      if (n.includes('вычеркнуто')) return 'crossed';
      if (n.includes('без досмотра')) return 'no_inspection';
      if (n.includes('с досмотром')) return 'with_inspection';
      return 'neutral';
    }

    // Разбор российского номера на основную часть и регион для красивого рендера
    function parseRussianPlate(plate) {
      const raw = String(plate || '').trim();
      // Стандартные форматы: "А 005 ОО 77", "Х400МК177", "М060УХ 799", "5241ХА 77", "2817АУ 50"
      const stdMatch = raw.match(/^([А-ЯA-Z0-9]\s*\d{3}\s*[А-ЯA-Z]{2})\s*(\d{2,3})$/i);
      if (stdMatch) {
        return { main: stdMatch[1].replace(/\s+/g, ' ').toUpperCase(), region: stdMatch[2] };
      }
      const motoMatch = raw.match(/^(\d{4}\s*[А-ЯA-Z]{2})\s*(\d{2,3})$/i);
      if (motoMatch) {
        return { main: motoMatch[1].replace(/\s+/g, ' ').toUpperCase(), region: motoMatch[2] };
      }
      return { main: raw, region: '' };
    }

    function rebuildAllCars() {
      allCars = [
        ...customCars.map((c, idx) => ({ ...c, _id: 'custom_' + idx, _custom: true })),
        ...BASE_CARS.map((c, idx) => ({ ...c, _id: 'base_' + idx, _custom: false }))
      ];
      document.getElementById('totalBadge').textContent = allCars.length;
      renderListChips();
    }

    // =========================================================================
    // 3. РЕНДЕР ФИЛЬТРОВ-ЧИПОВ
    // =========================================================================
    function renderListChips() {
      const container = document.getElementById('listChipsContainer');
      const counts = { ALL: allCars.length };
      LIST_ORDER.forEach(name => counts[name] = 0);
      allCars.forEach(c => {
        counts[c.list] = (counts[c.list] || 0) + 1;
      });

      const items = [
        { key: 'ALL', label: `Все (${counts.ALL})` },
        ...LIST_ORDER.map(name => ({ key: name, label: `${name} (${counts[name] || 0})` }))
      ];

      container.innerHTML = items.map(item => {
        const isActive = activeList === item.key;
        const cls = isActive
          ? 'bg-blue-600 text-white border-blue-600 shadow-xs'
          : 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200';
        return `<button type="button" data-list="${escapeHtml(item.key)}" class="list-chip px-3 py-1.5 rounded-xl border text-xs font-semibold whitespace-nowrap transition cursor-pointer shrink-0 ${cls}">${escapeHtml(item.label)}</button>`;
      }).join('');

      container.querySelectorAll('.list-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          activeList = btn.getAttribute('data-list');
          renderListChips();
          applyFilters();
        });
      });
    }

    function updateStatusChipsUI() {
      document.querySelectorAll('.status-chip').forEach(btn => {
        const st = btn.getAttribute('data-status');
        const active = st === activeStatus;
        btn.classList.remove(
          'bg-slate-800', 'text-white',
          'bg-emerald-600', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200',
          'bg-rose-600', 'bg-rose-50', 'text-rose-800', 'border-rose-200',
          'bg-slate-100', 'text-slate-700'
        );
        if (st === 'all') {
          btn.classList.add(...(active ? ['bg-slate-800', 'text-white'] : ['bg-slate-100', 'text-slate-700']));
        } else if (st === 'no_inspection') {
          btn.classList.add(...(active ? ['bg-emerald-600', 'text-white'] : ['bg-emerald-50', 'text-emerald-800', 'border-emerald-200']));
        } else if (st === 'with_inspection') {
          btn.classList.add(...(active ? ['bg-rose-600', 'text-white'] : ['bg-rose-50', 'text-rose-800', 'border-rose-200']));
        }
      });
    }

    // =========================================================================
    // 4. УМНЫЙ ПОИСК И ФИЛЬТРАЦИЯ
    // =========================================================================
    function applyFilters() {
      const rawQuery = document.getElementById('searchInput').value.trim();
      const qLower = rawQuery.toLowerCase();
      const qNoSpaces = qLower.replace(/\s+/g, '');
      const clearBtn = document.getElementById('clearSearchBtn');
      clearBtn.classList.toggle('hidden', rawQuery.length === 0);

      // Проверяем, является ли запрос чисто цифровым
      const isPureDigits = /^\d+$/.test(rawQuery);
      const queryInt = isPureDigits ? parseInt(rawQuery, 10) : null;

      filteredCars = allCars.filter(car => {
        // Фильтр по списку
        if (activeList !== 'ALL' && car.list !== activeList) return false;

        // Фильтр по статусу досмотра
        const status = getInspectionStatus(car.note);
        if (activeStatus === 'no_inspection' && status !== 'no_inspection') return false;
        if (activeStatus === 'with_inspection' && status !== 'with_inspection') return false;

        // Фильтр по поисковому запросу
        if (!rawQuery) return true;

        const plateLower = String(car.plate || '').toLowerCase();
        const plateCompact = plateLower.replace(/\s+/g, '');
        const carNum = Number(car.num);

        if (digitsOnlyMode) {
          const digitsQuery = rawQuery.replace(/\D/g, '');
          if (!digitsQuery) return true;
          const dInt = parseInt(digitsQuery, 10);
          return carNum === dInt || plateCompact.includes(digitsQuery);
        }

        if (isPureDigits) {
          // Умное совпадение: 770 -> num===770 или подстрока 770; 1 или 001 -> num===1 или подстрока
          if (carNum === queryInt) return true;
          if (plateCompact.includes(rawQuery)) return true;
          if (String(car.phone || '').replace(/\D/g, '').includes(rawQuery)) return true;
          return false;
        }

        // Текстовый / смешанный запрос по всем полям
        if (plateLower.includes(qLower) || plateCompact.includes(qNoSpaces)) return true;
        if (String(car.model || '').toLowerCase().includes(qLower)) return true;
        if (String(car.driver || '').toLowerCase().includes(qLower)) return true;
        if (String(car.org || '').toLowerCase().includes(qLower)) return true;
        if (String(car.note || '').toLowerCase().includes(qLower)) return true;
        if (String(car.color || '').toLowerCase().includes(qLower)) return true;
        if (String(car.list || '').toLowerCase().includes(qLower)) return true;
        if (String(car.phone || '').toLowerCase().includes(qLower)) return true;

        return false;
      });

      // Сортировка результатов: при цифровом поиске точные совпадения по основному номеру (num) поднимаем наверх
      if (rawQuery && /^\d+$/.test(rawQuery)) {
        const targetNum = parseInt(rawQuery, 10);
        filteredCars.sort((a, b) => {
          const aExact = Number(a.num) === targetNum ? 0 : 1;
          const bExact = Number(b.num) === targetNum ? 0 : 1;
          if (aExact !== bExact) return aExact - bExact;
          return Number(a.num) - Number(b.num);
        });
      }

      visibleLimit = 60;
      renderCards();
    }

    // =========================================================================
    // 5. РЕНДЕР КАРТОЧЕК РЕЗУЛЬТАТОВ
    // =========================================================================
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function extractCallablePhones(phoneStr) {
      if (!phoneStr) return [];
      // Разбиваем по "/", если указано два телефона
      return String(phoneStr)
        .split('/')
        .map(part => {
          const digits = part.replace(/\D/g, '');
          if (digits.length < 7) return null;
          const tel = digits.startsWith('8') && digits.length === 11
            ? '+7' + digits.slice(1)
            : (digits.startsWith('7') && digits.length === 11 ? '+' + digits : digits);
          return { label: part.trim(), tel };
        })
        .filter(Boolean);
    }

    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      const emptyState = document.getElementById('emptyState');
      const foundCount = document.getElementById('foundCount');
      const loadMoreWrap = document.getElementById('loadMoreWrap');
      const loadMoreBtn = document.getElementById('loadMoreBtn');

      foundCount.textContent = filteredCars.length;

      if (filteredCars.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        loadMoreWrap.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      const slice = filteredCars.slice(0, visibleLimit);

      grid.innerHTML = slice.map(car => {
        const status = getInspectionStatus(car.note);
        const listStyle = LIST_STYLES[car.list] || 'bg-slate-100 text-slate-800 border-slate-200';
        const parsedPlate = parseRussianPlate(car.plate);
        const phones = extractCallablePhones(car.phone);

        let statusBadge = '';
        if (status === 'no_inspection') {
          statusBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-200">✓ Без досмотра</span>`;
        } else if (status === 'with_inspection') {
          statusBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-bold bg-rose-100 text-rose-800 border border-rose-200">! С досмотром</span>`;
        } else if (status === 'crossed') {
          statusBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-200 text-slate-600 line-through">Вычеркнуто</span>`;
        }

        // Убираем дублирование слов статуса из текста дополнительного примечания
        let extraNote = String(car.note || '').trim();
        if (/^(без досмотра|с досмотром|вычеркнуто)$/i.test(extraNote)) {
          extraNote = '';
        }

        const plateHtml = parsedPlate.region
          ? `<div class="ru-plate ${status === 'crossed' ? 'opacity-60 line-through' : ''}">
               <div class="ru-plate-main">${escapeHtml(parsedPlate.main)}</div>
               <div class="ru-plate-reg">
                 <span class="ru-plate-reg-num">${escapeHtml(parsedPlate.region)}</span>
                 <span class="ru-plate-rus">RUS<span class="ru-flag"></span></span>
               </div>
             </div>`
          : `<div class="ru-plate ${status === 'crossed' ? 'opacity-60 line-through' : ''}">
               <div class="ru-plate-main">${escapeHtml(parsedPlate.main)}</div>
             </div>`;

        const cardBorder = status === 'no_inspection'
          ? 'border-emerald-200/90'
          : (status === 'with_inspection' ? 'border-rose-300' : 'border-slate-200');

        return `
          <article class="bg-white rounded-2xl border ${cardBorder} p-4 shadow-xs hover:shadow-md transition flex flex-col justify-between gap-3 ${status === 'crossed' ? 'opacity-75 bg-slate-50' : ''}">
            <div>
              <!-- Верх карточки: Название списка жирным и статус -->
              <div class="flex items-start justify-between gap-2 mb-3">
                <span class="inline-block px-2.5 py-1 rounded-lg border text-xs font-extrabold tracking-tight ${listStyle}">
                  ${escapeHtml(car.list)}
                </span>
                <div class="flex items-center gap-1.5 shrink-0">
                  ${car._custom ? '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-100 text-amber-800">Новое</span>' : ''}
                  ${statusBadge}
                </div>
              </div>

              <!-- Гос. номер + Марка и цвет -->
              <div class="flex flex-wrap items-center justify-between gap-2.5 pb-3 border-b border-slate-100">
                ${plateHtml}
                <div class="text-right min-w-0 flex-1">
                  <div class="text-sm sm:text-base font-bold text-slate-900 leading-snug break-words">
                    ${car.model ? escapeHtml(car.model) : '<span class="text-slate-400 font-normal">Марка не указана</span>'}
                  </div>
                  ${car.color ? `<div class="text-xs font-medium text-slate-500 mt-0.5">Цвет: <span class="text-slate-700">${escapeHtml(car.color)}</span></div>` : ''}
                </div>
              </div>

              <!-- Детали: Водитель, Организация, Примечание -->
              <dl class="mt-3 space-y-1.5 text-xs sm:text-sm">
                ${car.driver ? `
                  <div class="flex items-start gap-2">
                    <dt class="text-slate-400 shrink-0 w-24">Водитель:</dt>
                    <dd class="font-semibold text-slate-800 break-words">${escapeHtml(car.driver)}</dd>
                  </div>` : ''}
                ${car.org ? `
                  <div class="flex items-start gap-2">
                    <dt class="text-slate-400 shrink-0 w-24">Организация:</dt>
                    <dd class="font-medium text-slate-700 break-words">${escapeHtml(car.org)}</dd>
                  </div>` : ''}
                ${extraNote ? `
                  <div class="flex items-start gap-2">
                    <dt class="text-slate-400 shrink-0 w-24">Примечание:</dt>
                    <dd class="text-slate-700 bg-slate-50 px-2 py-1 rounded-lg border border-slate-100 flex-1 break-words">${escapeHtml(extraNote)}</dd>
                  </div>` : ''}
              </dl>
            </div>

            <!-- Нижняя панель карточки: Телефон / Позвонить -->
            ${phones.length > 0 ? `
              <div class="pt-2.5 border-t border-slate-100 flex flex-wrap gap-2">
                ${phones.map(p => `
                  <a href="tel:${escapeHtml(p.tel)}" class="flex-1 inline-flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-blue-50 hover:bg-blue-600 text-blue-700 hover:text-white border border-blue-200 hover:border-blue-600 text-xs sm:text-sm font-bold transition">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                    </svg>
                    <span>Позвонить: ${escapeHtml(p.label)}</span>
                  </a>
                `).join('')}
              </div>
            ` : (car.phone ? `
              <div class="pt-2 border-t border-slate-100 text-xs text-slate-600 font-medium">
                Контакт: ${escapeHtml(car.phone)}
              </div>
            ` : '')}
          </article>
        `;
      }).join('');

      if (filteredCars.length > visibleLimit) {
        const remaining = filteredCars.length - visibleLimit;
        loadMoreBtn.textContent = `Показать ещё (осталось ${remaining})`;
        loadMoreWrap.classList.remove('hidden');
      } else {
        loadMoreWrap.classList.add('hidden');
      }
    }

    // =========================================================================
    // 6. СОБЫТИЯ ИНТЕРФЕЙСА, ДОБАВЛЕНИЕ АВТО И ЭКСПОРТ
    // =========================================================================
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.add('hidden'), 3000);
    }

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', applyFilters);

    document.getElementById('clearSearchBtn').addEventListener('click', () => {
      searchInput.value = '';
      applyFilters();
      searchInput.focus();
    });

    // Переключение режимов "Все поля" / "Только цифры номера"
    const modeAllBtn = document.getElementById('modeAllBtn');
    const modeDigitsBtn = document.getElementById('modeDigitsBtn');

    modeAllBtn.addEventListener('click', () => {
      digitsOnlyMode = false;
      searchInput.setAttribute('inputmode', 'text');
      searchInput.placeholder = 'Введите цифры номера (напр. 770, 400, 1) или фамилию, авто...';
      modeAllBtn.classList.add('bg-white', 'text-blue-700', 'shadow-sm');
      modeAllBtn.classList.remove('text-slate-600');
      modeDigitsBtn.classList.remove('bg-white', 'text-blue-700', 'shadow-sm');
      modeDigitsBtn.classList.add('text-slate-600');
      applyFilters();
      searchInput.focus();
    });

    modeDigitsBtn.addEventListener('click', () => {
      digitsOnlyMode = true;
      searchInput.setAttribute('inputmode', 'numeric');
      searchInput.placeholder = 'Введите только цифры гос. номера (например: 770, 400, 1)...';
      modeDigitsBtn.classList.add('bg-white', 'text-blue-700', 'shadow-sm');
      modeDigitsBtn.classList.remove('text-slate-600');
      modeAllBtn.classList.remove('bg-white', 'text-blue-700', 'shadow-sm');
      modeAllBtn.classList.add('text-slate-600');
      applyFilters();
      searchInput.focus();
    });

    // Цифровая панель
    const numpadPanel = document.getElementById('numpadPanel');
    document.getElementById('toggleNumpadBtn').addEventListener('click', () => {
      numpadPanel.classList.toggle('hidden');
    });

    document.querySelectorAll('.numpad-key').forEach(btn => {
      btn.addEventListener('click', () => {
        searchInput.value += btn.getAttribute('data-digit');
        applyFilters();
      });
    });

    document.getElementById('numpadBackspace').addEventListener('click', () => {
      searchInput.value = searchInput.value.slice(0, -1);
      applyFilters();
    });

    document.getElementById('numpadClear').addEventListener('click', () => {
      searchInput.value = '';
      applyFilters();
    });

    // Фильтры статусов
    document.querySelectorAll('.status-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        activeStatus = btn.getAttribute('data-status');
        updateStatusChipsUI();
        applyFilters();
      });
    });

    document.getElementById('resetFiltersBtn').addEventListener('click', () => {
      searchInput.value = '';
      activeList = 'ALL';
      activeStatus = 'all';
      renderListChips();
      updateStatusChipsUI();
      applyFilters();
    });

    document.getElementById('loadMoreBtn').addEventListener('click', () => {
      visibleLimit += 80;
      renderCards();
    });

    // Модальное окно добавления авто
    const addModal = document.getElementById('addModal');
    document.getElementById('openAddModalBtn').addEventListener('click', () => {
      addModal.classList.remove('hidden');
      document.getElementById('fPlate').focus();
    });
    const closeAddModal = () => addModal.classList.add('hidden');
    document.getElementById('closeAddModalBtn').addEventListener('click', closeAddModal);
    document.getElementById('cancelAddModalBtn').addEventListener('click', closeAddModal);
    addModal.addEventListener('click', (e) => {
      if (e.target === addModal) closeAddModal();
    });

    document.getElementById('addCarForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const plate = document.getElementById('fPlate').value.trim().toUpperCase();
      if (!plate) return;

      const statusPreset = document.getElementById('fStatusPreset').value;
      const rawNote = document.getElementById('fNote').value.trim();
      const combinedNote = [statusPreset, rawNote].filter(Boolean).join('; ');

      const newCar = {
        list: document.getElementById('fList').value,
        plate: plate,
        num: extractMainNumber(plate),
        model: document.getElementById('fModel').value.trim(),
        color: document.getElementById('fColor').value.trim(),
        driver: document.getElementById('fDriver').value.trim(),
        org: document.getElementById('fOrg').value.trim(),
        phone: document.getElementById('fPhone').value.trim(),
        note: combinedNote
      };

      customCars.unshift(newCar);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(customCars));
      } catch (err) {
        console.warn('Ошибка сохранения в localStorage:', err);
      }

      e.target.reset();
      closeAddModal();
      rebuildAllCars();
      applyFilters();
      showToast(`Автомобиль ${newCar.plate} добавлен в базу`);
    });

    // Меню экспорта
    const exportMenuBtn = document.getElementById('exportMenuBtn');
    const exportDropdown = document.getElementById('exportDropdown');
    exportMenuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      exportDropdown.classList.toggle('hidden');
    });
    document.addEventListener('click', () => exportDropdown.classList.add('hidden'));

    function downloadBlob(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    document.getElementById('exportJsonBtn').addEventListener('click', () => {
      const clean = allCars.map(({ _id, _custom, ...rest }) => rest);
      downloadBlob(JSON.stringify(clean, null, 2), 'baza_propuskov_backup.json', 'application/json;charset=utf-8');
      showToast('Резервная копия JSON скачана');
    });

    document.getElementById('exportCsvBtn').addEventListener('click', () => {
      const headers = ['Название списка', 'Гос. номер', 'Цифровой номер', 'Марка/Модель', 'Цвет', 'Водитель', 'Организация', 'Телефон', 'Примечание'];
      const escCsv = (val) => `"${String(val || '').replace(/"/g, '""')}"`;
      const rows = allCars.map(c => [
        c.list, c.plate, c.num, c.model, c.color, c.driver, c.org, c.phone, c.note
      ].map(escCsv).join(';'));
      const csvContent = '\uFEFF' + [headers.map(escCsv).join(';'), ...rows].join('\r\n');
      downloadBlob(csvContent, 'baza_propuskov_export.csv', 'text/csv;charset=utf-8');
      showToast('Таблица CSV для Excel скачана');
    });

    document.getElementById('resetCustomBtn').addEventListener('click', () => {
      if (customCars.length === 0) {
        showToast('Нет добавленных вручную записей');
        return;
      }
      customCars = [];
      localStorage.removeItem(STORAGE_KEY);
      rebuildAllCars();
      applyFilters();
      showToast('Добавленные вручную записи удалены');
    });

    // =========================================================================
    // 7. PWA: ДИНАМИЧЕСКИЙ MANIFEST И SERVICE WORKER ДЛЯ РАБОТЫ ОФЛАЙН
    // =========================================================================
    (function setupPwa() {
      try {
        const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#0f172a"/><rect x="24" y="68" width="144" height="56" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="6"/><text x="96" y="106" font-family="monospace" font-size="34" font-weight="bold" fill="#0f172a" text-anchor="middle">770 RUS</text></svg>`;
        const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);

        const manifest = {
          name: 'База пропусков — Поиск ТС',
          short_name: 'База пропусков',
          description: 'Мгновенный офлайн-поиск автомобилей по спискам пропусков',
          start_url: location.href,
          display: 'standalone',
          background_color: '#f1f5f9',
          theme_color: '#0f172a',
          icons: [
            { src: iconUrl, sizes: '192x192', type: 'image/svg+xml' },
            { src: iconUrl, sizes: '512x512', type: 'image/svg+xml' }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
          const swCode = `
            const CACHE_NAME = 'baza-propuskov-v1';
            self.addEventListener('install', (e) => {
              self.skipWaiting();
              e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll([self.location.href]).catch(() => {})));
            });
            self.addEventListener('activate', (e) => {
              e.waitUntil(self.clients.claim());
            });
            self.addEventListener('fetch', (e) => {
              e.respondWith(
                caches.match(e.request).then(cached => cached || fetch(e.request).then(resp => {
                  const copy = resp.clone();
                  caches.open(CACHE_NAME).then(cache => cache.put(e.request, copy)).catch(() => {});
                  return resp;
                }).catch(() => cached))
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        }
      } catch (e) {
        // Игнорируем ограничения sandbox/iframe при предпросмотре
      }

      let deferredPrompt = null;
      const installBtn = document.getElementById('installPwaBtn');
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.classList.remove('hidden');
        installBtn.classList.add('inline-flex');
      });

      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.classList.add('hidden');
      });

      const updateOnlineStatus = () => {
        const el = document.getElementById('offlineStatusText');
        el.textContent = navigator.onLine
          ? 'Онлайн • База сохранена в устройстве'
          : 'Офлайн-режим • Все 382+ записи доступны';
      };
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      updateOnlineStatus();
    })();

    // Инициализация приложения при загрузке страницы
    window.addEventListener('DOMContentLoaded', () => {
      rebuildAllCars();
      updateStatusChipsUI();
      applyFilters();
    });
  </script>
</body>
</html>
